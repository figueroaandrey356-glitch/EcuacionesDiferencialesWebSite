name: Build and Deploy React App

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: WebSiteEcuas-App/package-lock.json

      - name: Install dependencies
        working-directory: ./WebSiteEcuas-App
        run: npm ci

      # Claves públicas de Supabase (Settings → Secrets and variables → Actions → Variables).
      # Si faltan, el sitio se publica con los exámenes de ejemplo y sin /admin.
      - name: Build React app
        working-directory: ./WebSiteEcuas-App
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      # GitHub Pages has no SPA fallback; serving index.html as 404 lets deep links like /exams load
      - name: Add SPA fallback
        run: cp WebSiteEcuas-App/dist/index.html WebSiteEcuas-App/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: ./WebSiteEcuas-App/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
